name: Deploy Python workers

on:
  push:
    branches: [main]
    paths:
      - "ads-worker/**"
      - "img-worker/**"
      - ".github/workflows/deploy-python-workers.yml"
  workflow_dispatch:

concurrency:
  group: python-workers-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        shell: bash
        env:
          ORACLE_VPS_HOST: ${{ secrets.ORACLE_VPS_HOST }}
          ORACLE_VPS_SSH_KEY: ${{ secrets.ORACLE_VPS_SSH_KEY }}
          ORACLE_VPS_SSH_KEY_B64: ${{ secrets.ORACLE_VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VPS_HOST" || { echo "Missing ORACLE_VPS_HOST"; exit 1; }
          test -n "${ORACLE_VPS_SSH_KEY_B64:-$ORACLE_VPS_SSH_KEY}" || { echo "Missing SSH key secret"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          if [ -n "${ORACLE_VPS_SSH_KEY_B64:-}" ]; then
            printf '%s' "$ORACLE_VPS_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/oracle_worker_key"
          else
            printf '%s\n' "$ORACLE_VPS_SSH_KEY" > "$HOME/.ssh/oracle_worker_key"
          fi
          chmod 600 "$HOME/.ssh/oracle_worker_key"
          ssh-keyscan -H "$ORACLE_VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Build and restart Python workers on Oracle VPS
        shell: bash
        env:
          ORACLE_VPS_HOST: ${{ secrets.ORACLE_VPS_HOST }}
          ORACLE_VPS_USER: ${{ secrets.ORACLE_VPS_USER }}
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VPS_USER" || { echo "Missing ORACLE_VPS_USER"; exit 1; }
          test -n "$BWS_ACCESS_TOKEN" || { echo "Missing BWS_ACCESS_TOKEN"; exit 1; }
          printf -v BWS_ESCAPED '%q' "$BWS_ACCESS_TOKEN"
          ssh -i "$HOME/.ssh/oracle_worker_key" "$ORACLE_VPS_USER@$ORACLE_VPS_HOST" "BWS_ACCESS_TOKEN=$BWS_ESCAPED bash -se" <<'REMOTE'
          set -euo pipefail
          cd /home/opc/symphony
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          # The Python Dockerfiles intentionally use the same bws binary as
          # the video worker, but Docker build contexts are per-directory.
          # Reuse the already provisioned binary without committing a copy.
          test -x ./video-worker/.build-assets/bws || {
            echo 'Missing video-worker/.build-assets/bws on VPS'
            exit 1
          }
          mkdir -p ./img-worker/.build-assets ./ads-worker/.build-assets
          cp ./video-worker/.build-assets/bws ./img-worker/.build-assets/bws
          cp ./video-worker/.build-assets/bws ./ads-worker/.build-assets/bws

          # Retire only known worker containers that may still own the old
          # published ports. Refuse to touch an unexpected service.
          for port in 8082 8083; do
            old_names="$(docker ps --filter "publish=$port" --format '{{.Names}}')"
            while IFS= read -r old_name; do
              [ -z "$old_name" ] && continue
              case "$old_name" in
                img-worker|symphony-img-worker|ads-worker|symphony-ads-worker)
                  docker rm -f "$old_name" ;;
                *)
                  echo "Unexpected container '$old_name' owns port $port; refusing to remove it"
                  exit 1 ;;
              esac
            done <<< "$old_names"
          done
          docker rm -f symphony-img-worker symphony-ads-worker 2>/dev/null || true

          docker build -t symphony-img-worker:latest ./img-worker
          docker run -d \
            --name symphony-img-worker \
            --restart unless-stopped \
            -e BWS_ACCESS_TOKEN="$BWS_ACCESS_TOKEN" \
            symphony-img-worker:latest \
            sh -c 'bws run --project-id 74f0a638-b3d9-4878-989d-b491001819bb -- python worker.py'

          docker build -t symphony-ads-worker:latest ./ads-worker
          docker run -d \
            --name symphony-ads-worker \
            --restart unless-stopped \
            -e BWS_ACCESS_TOKEN="$BWS_ACCESS_TOKEN" \
            symphony-ads-worker:latest \
            sh -c 'bws run --project-id 74f0a638-b3d9-4878-989d-b491001819bb -- python worker.py'

          sleep 8
          failed=0
          if ! docker exec symphony-img-worker python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=3)" >/dev/null; then
            echo 'Image worker health check failed'
            docker logs --tail 120 symphony-img-worker || true
            failed=1
          fi
          if ! docker exec symphony-ads-worker python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/', timeout=3)" >/dev/null; then
            echo 'Ads worker health check failed'
            docker logs --tail 120 symphony-ads-worker || true
            failed=1
          fi
          docker ps --filter name=symphony-img-worker --filter name=symphony-ads-worker --format 'worker={{.Names}} status={{.Status}}'
          test "$failed" -eq 0
          REMOTE
